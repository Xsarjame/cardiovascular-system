<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P'MAX - System Login & Gateway</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; background-color: #020617; color: #f1f5f9; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-2xl w-full max-w-md">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold tracking-wide text-white">P'MAX <span class="text-xs font-normal text-slate-400 block mt-1">Cardiovascular Monitoring System</span></h1>
            <p class="text-xs text-slate-500 mt-2">Please authenticate to connect with database and hardware gateway.</p>
        </div>

        <form id="login-form" onsubmit="handleLogin(event)" class="space-y-5">
            <div>
                <label class="block text-xs font-medium text-slate-400 mb-1">Clinic / Staff ID</label>
                <input type="text" id="username" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2.5 text-sm text-white focus:outline-none focus:border-emerald-500 font-mono" placeholder="e.g. DOC-001">
            </div>
            <div>
                <label class="block text-xs font-medium text-slate-400 mb-1">Access Key / Password</label>
                <input type="password" id="password" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2.5 text-sm text-white focus:outline-none focus:border-emerald-500" placeholder="••••••••">
            </div>
            
            <div id="error-message" class="text-xs text-red-400 text-center hidden"></div>
            
            <button type="submit" id="login-btn" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-2.5 rounded-lg transition duration-200 cursor-pointer text-sm">
                Access Control Center (Login)
            </button>
        </form>

        <div class="mt-6 text-center border-t border-slate-800 pt-4 flex justify-between items-center text-xs">
            <span class="text-slate-500">Backend Gateway: <span id="gateway-status" class="text-amber-400 font-mono">Checking...</span></span>
            <span class="text-slate-500">ZKP Security: <span class="text-emerald-400 font-mono">Active</span></span>
        </div>
    </div>

    <script>
        // ตรวจสอบการเชื่อมต่อกับ Backend ทันทีที่โหลดหน้าเว็บ (เชื่อมโยงแบบ Real-time)
        async function checkBackendConnection() {
            const statusEl = document.getElementById('gateway-status');
            try {
                const response = await fetch('/api/v1/blockchain/chain');
                if (response.ok) {
                    statusEl.innerText = 'Connected';
                    statusEl.className = 'text-emerald-400 font-mono';
                } else {
                    statusEl.innerText = 'Degraded';
                    statusEl.className = 'text-amber-400 font-mono';
                }
            } catch (err) {
                statusEl.innerText = 'Offline';
                statusEl.className = 'text-red-400 font-mono';
            }
        }

        checkBackendConnection();

        // ฟังก์ชันจัดการการล็อกอินและเชื่อมต่อระบบหลัก
        async function handleLogin(event) {
            event.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorEl = document.getElementById('error-message');
            const loginBtn = document.getElementById('login-btn');
            
            errorEl.classList.add('hidden');
            loginBtn.innerText = 'Authenticating with ZKP...';
            loginBtn.disabled = true;

            try {
                // ส่งข้อมูลไปยืนยันตัวตนกับ FastAPI Backend
                const response = await fetch('/api/v1/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                if (response.ok) {
                    const data = await response.json();
                    
                    // บันทึก Session ลง LocalStorage เพื่อใช้ส่งต่อสิทธิ์ไปยัง Dashboard และ Blockchain
                    localStorage.setItem('pmax_token', data.token);
                    localStorage.setItem('pmax_user', username);
                    localStorage.setItem('pmax_auth_time', new Date().toISOString());

                    // เปลี่ยนเส้นทางเข้าสู่หน้า Dashboard หลัก
                    window.location.href = 'dashboard.html';
                } else {
                    const errData = await response.json();
                    errorEl.innerText = errData.detail || 'Authentication failed. Please check your credentials.';
                    errorEl.classList.remove('hidden');
                    loginBtn.innerText = 'Access Control Center (Login)';
                    loginBtn.disabled = false;
                }
            } catch (err) {
                errorEl.innerText = 'Cannot connect to backend server. Please ensure main.py is running.';
                errorEl.classList.remove('hidden');
                loginBtn.innerText = 'Access Control Center (Login)';
                loginBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
